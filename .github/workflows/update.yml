name: update

# Check for new upstream Lima releases; if there is one, bump lima.spec,
# make sure it still builds, and push. COPR rebuilds on push (webhook):
#  - main: the latest release, built in kir/lima;
#  - beta: main with the version of the latest prerelease, as long as it is
#    newer than the latest release, built in kir/lima-beta.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  PACKAGER: Kir Kolyshkin <kolyshkin@gmail.com>

jobs:
  # Scheduled runs skip the rest unless the list of upstream releases has
  # changed since the last successful run (remembered in the actions cache).
  check:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      seen: ${{ steps.lookup.outputs.cache-hit }}
    steps:
      - name: fingerprint upstream releases
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sum=$(gh api 'repos/lima-vm/lima/releases?per_page=30' \
            --jq '.[] | select(.draft | not) | "\(.tag_name) \(.prerelease)"' |
            sha256sum | cut -c1-16)
          echo "key=releases-$sum" >> "$GITHUB_OUTPUT"

      - name: look up the fingerprint
        if: steps.key.outputs.key != ''
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: releases
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

  stable:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.seen != 'true'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: install deps
        run: dnf -y install git-core rpmdevtools rpm-build jq

      - uses: actions/checkout@v7

      - name: bump spec to the latest release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          latest=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/lima-vm/lima/releases/latest | jq -r .tag_name)
          latest=${latest#v}
          current=$(rpmspec -q --srpm --qf '%{version}' lima.spec)
          echo "current: $current, latest: $latest"
          # rpmdev-vercmp exits with 11 if the first version is newer.
          rc=0
          rpmdev-vercmp "$latest" "$current" >/dev/null || rc=$?
          if [ "$rc" -ne 11 ]; then
            echo "nothing to do"
            exit 0
          fi
          rpmdev-bumpspec -n "$latest" -c "Update to $latest" -u "$PACKAGER" lima.spec
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      # Scheduled runs only build when there is something new.
      - name: build
        if: github.event_name != 'schedule' || steps.bump.outputs.version != ''
        run: sh .github/build.sh

      - name: push
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to ${{ steps.bump.outputs.version }}"
          git push

  beta:
    needs: stable
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: install deps
        run: dnf -y install git-core rpmdevtools rpm-build jq

      # Fresh main, including a bump just pushed by the stable job.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: regenerate the beta branch
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          stable=$(rpmspec -q --srpm --qf '%{version}' lima.spec)
          pre=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/lima-vm/lima/releases?per_page=30" |
            jq -r '[.[] | select(.prerelease and (.draft | not))][0].tag_name // empty')
          # v1.2.3-beta.0 -> 1.2.3~beta.0, which RPM sorts before 1.2.3.
          pre=${pre#v}
          pre=${pre/-/\~}
          echo "stable: $stable, prerelease: ${pre:-none}"
          rc=0
          [ -n "$pre" ] && { rpmdev-vercmp "$pre" "$stable" >/dev/null || rc=$?; }
          if [ "$rc" -ne 11 ]; then
            echo "no prerelease newer than $stable"
            exit 0
          fi
          # The beta branch is main plus one commit changing the version.
          if git rev-parse -q --verify origin/beta >/dev/null; then
            git show origin/beta:lima.spec > "$RUNNER_TEMP/beta.spec"
            current=$(rpmspec -q --srpm --qf '%{version}' "$RUNNER_TEMP/beta.spec")
            # Changes to main outside of what goes into the SRPM (README, CI)
            # do not need a beta rebuild.
            if [ "$current" = "$pre" ] &&
              git diff --quiet origin/beta^ HEAD -- lima.spec lima-keyring.asc .copr; then
              echo "beta is up to date"
              exit 0
            fi
          fi
          # Release must grow when beta is regenerated on top of a newer main;
          # use the number of commits in main (bumpspec adds one).
          n=$(git rev-list --count HEAD)
          git checkout -B beta
          sed -i -E "s/^(Version:\s+).*/\1$pre/; s/^(Release:\s+)[0-9]+/\1$((n - 1))/" lima.spec
          rpmdev-bumpspec -c "Update to $pre" -u "$PACKAGER" lima.spec
          echo "version=$pre" >> "$GITHUB_OUTPUT"

      - name: build
        if: steps.bump.outputs.version != ''
        run: sh .github/build.sh

      - name: push
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to ${{ steps.bump.outputs.version }}"
          git push --force origin beta

  remember:
    needs: [check, beta]
    if: needs.check.outputs.key != '' && needs.check.outputs.seen != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.check.outputs.key }}" > releases
      - uses: actions/cache/save@v6
        with:
          path: releases
          key: ${{ needs.check.outputs.key }}
